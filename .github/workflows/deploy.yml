name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, to refresh model_stats.json and sbml_files.json as models are
  # added to BiomodelsStore.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C /usr/local/bin

      - name: Test
        run: cargo test

      - name: Build
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      # Every model's statistics (model_stats.json, for the search filters)
      # and its SBML file name (sbml_files.json; the names vary), from a
      # shallow copy of the store, written beside the page.
      - name: Model statistics and SBML file list
        run: |
          git clone --depth 1 https://github.com/sys-bio/BiomodelsStore "$RUNNER_TEMP/store"
          cargo run --release --bin model_stats -- "$RUNNER_TEMP/store/biomodels" dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
